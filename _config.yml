locale: "en-US"
title: "Scott Olesen"
title_separator: "-"
name: &name "Scott Olesen"
description: &description "Data Scientist / Epidemiologist"
url: "https://scottolesen.com"
baseurl: ""
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false

author:
  name: "Scott Olesen"
  avatar: "face.png"
  bio: "Data Scientist/Epidemiologist at CDC CFA"
  location: "Washington, DC"
  github: "swo"
  linkedin: "scott-olesen/"
  orcid: "https://orcid.org/0000-0001-5400-4945"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

permalink: /:categories/:title/
timezone: America/New_York

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
